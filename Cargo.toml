[package]
name = "git-todo"
version = "0.1.0"
edition = "2021"

[dependencies]
im = {version = "15.1.0"}
floem = { git = "https://github.com/lapce/floem.git", features = ["rfd-async-std"], optional = true }
color = "0.2.3"
rusqlite = { version = "0.34.0", features = ["bundled"] }
clap = { version = "4.4.18", features = ["derive"] }

[features]
ui = ["dep:floem", "floem/vello"]
vello = ["floem/vello"]
